name: ci

# Builds and tests the data layer and the CLI on all three platforms.  The GUI
# is deliberately off here: the core library and the CLI must stay buildable
# without a Qt install, and that is the property this job protects.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest }
          - { name: linux-x64,   os: ubuntu-latest }
          - { name: macos-arm64, os: macos-14 }

    steps:
      - uses: actions/checkout@v4

      # The detector's weights are not committed: 916 KB here (the "lite"
      # variant, for speed), 125 MB for "full" in the release, and CC BY-SA
      # 3.0 either way.  Without it the fastText path would be compiled but
      # never exercised.
      - name: Fetch the language-detection model
        shell: bash
        run: |
          mkdir -p models
          curl -sSL --retry 3 -o models/lid.176.ftz https://dl.fbaipublicfiles.com/fasttext/supervised-models/lid.176.ftz

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DMAXLABEL_BUILD_UI=OFF

      - name: Build
        run: cmake --build build --config Release -j 4

      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release

      - name: Smoke-test the CLI
        shell: bash
        run: |
          BIN=build/bin
          # Multi-config generators put the binary in a per-config directory.
          [ -f "$BIN/maxlabel_cli" ] || [ -f "$BIN/maxlabel_cli.exe" ] || BIN="$BIN/Release"
          "$BIN/maxlabel_cli" --help > /dev/null
          mkdir -p /tmp/smoke
          printf '%s\n' '<word text="重" language="zh" script="zhong" phonemes="zh ong"/>' > /tmp/smoke/line.pfml
          "$BIN/maxlabel_cli" validate /tmp/smoke/line.pfml
          printf '%s\n' '<word text="x"><bogus/></word>' > /tmp/smoke/bad.pfml
          if "$BIN/maxlabel_cli" validate /tmp/smoke/bad.pfml; then
            echo "expected the malformed fragment to be rejected"; exit 1
          fi

  # Separate job so the no-Qt job above stays fast and keeps proving that the
  # data layer builds without Qt.  MAXLABEL_BUILD_UI=ON is an error when Qt is
  # missing, so this job cannot pass without compiling the GUI.
  gui:
    name: gui-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest }
          - { name: linux-x64,   os: ubuntu-latest }
          - { name: macos-arm64, os: macos-14 }

    steps:
      - uses: actions/checkout@v4

      - name: Fetch the language-detection model
        shell: bash
        run: |
          mkdir -p models
          curl -sSL --retry 3 -o models/lid.176.ftz https://dl.fbaipublicfiles.com/fasttext/supervised-models/lid.176.ftz

      - name: Install Qt6 (Linux)
        if: runner.os == 'Linux'
        # The distro package: install-qt-action downloads several gigabytes and
        # took over 25 minutes on the first (uncached) run, which is not worth
        # it for a job that only needs Widgets.
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev qt6-multimedia-dev

      - name: Install Qt6 (Windows / macOS)
        if: runner.os != 'Linux'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          modules: qtmultimedia
          cache: true

      - name: Configure
        run: >
          cmake -S . -B build-gui
          -DCMAKE_BUILD_TYPE=Release
          -DMAXLABEL_BUILD_UI=ON

      - name: Build
        run: cmake --build build-gui --config Release -j 4
