name: release

# Pushing a v* tag publishes a release with per-platform archives.
# workflow_dispatch rebuilds the assets for an existing tag without moving it
# (the CUDA-style pattern used by tifa.cpp).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing tag to build and attach assets to'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest, archive: zip }
          - { name: linux-x64,   os: ubuntu-latest,  archive: tar.gz }
          - { name: macos-arm64, os: macos-14,       archive: tar.gz }

    steps:
      - uses: actions/checkout@v4

      # "full" is what split-lang asks for.  It is 125 MB, which is why it is
      # fetched here and bundled rather than committed; its weights are
      # CC BY-SA 3.0 (fastText's code is MIT).
      - name: Fetch the language-detection model
        shell: bash
        run: |
          mkdir -p models
          curl -sSL --retry 3 -o models/lid.176.bin https://dl.fbaipublicfiles.com/fasttext/supervised-models/lid.176.bin

      - name: Install Qt6 (Linux)
        if: runner.os == 'Linux'
        # The distro package: install-qt-action downloads several gigabytes and
        # took over 25 minutes on the first (uncached) run, which is not worth
        # it for a job that only needs Widgets.
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev qt6-multimedia-dev qt6-svg-dev qt6-tools-dev qt6-l10n-tools

      - name: Install Qt6 (Windows / macOS)
        if: runner.os != 'Linux'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          # qtsvg and qttools are part of the base archives; naming them here
          # makes aqt fail with "packages not found".
          modules: qtmultimedia
          cache: true

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j 4

      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release

      # The GUI needs its Qt runtime next to it; the CLI does not depend on Qt
      # at all, so both archives carry it and the CLI-only one always works.
      - name: Deploy the Qt runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "build/bin/Release"
          if (-not (Test-Path $bin)) { $bin = "build/bin" }
          windeployqt --release --no-translations --no-system-d3d-compiler "$bin/MaxLabel.exe"
          echo "BIN=$bin" >> $env:GITHUB_ENV

      - name: Deploy the Qt runtime (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          BIN=build/bin
          [ -d "$BIN/MaxLabel.app" ] || BIN="$BIN/Release"
          macdeployqt "$BIN/MaxLabel.app" -always-overwrite
          echo "BIN=$BIN" >> "$GITHUB_ENV"

      - name: Locate the binaries (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          BIN=build/bin
          [ -x "$BIN/maxlabel_cli" ] || BIN="$BIN/Release"
          echo "BIN=$BIN" >> "$GITHUB_ENV"

      - name: Smoke-test the packaged CLI
        shell: bash
        run: |
          # A real file, not a process substitution: <(...) yields /dev/fd/N,
          # which a native Windows binary cannot open.
          CLI="$BIN/maxlabel_cli"
          [ -x "$CLI" ] || CLI="$CLI.exe"
          printf '%s\n' '<word text="a" language="zh" script="a" phonemes="a"/>' > smoke.pfml
          "$CLI" --help > /dev/null
          "$CLI" validate smoke.pfml
          rm -f smoke.pfml

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Copy-Item README.md, LICENSE, CHANGELOG.md "$env:BIN"
          Copy-Item -Recurse -Force manual "$env:BIN/manual"
          # Everything under models/ ships: the BudouX tables, the phoneme
          # table and the pronunciation dictionaries are committed there, and
          # the language detector is downloaded into it two steps up.  Adding
          # a data file to a release means committing it to models/ — there is
          # no second list to remember.
          Copy-Item -Recurse -Force models "$env:BIN/models"
          # The test binaries are built into the same directory the release is
          # packaged from, so they have to be taken back out: they have already
          # done their job above, and shipping six of them to a user is six
          # executables that do not belong to the product.
          Get-ChildItem "$env:BIN" -Filter '*_test*' | Remove-Item -Force
          Compress-Archive -Path "$env:BIN/*" -DestinationPath "MaxLabel-${{ matrix.name }}.zip"

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          cp README.md LICENSE CHANGELOG.md "$BIN/"
          cp -r manual "$BIN/manual"
          cp -r models "$BIN/models"
          # See the zip step: the tests are built where the release is packaged
          # from and must not travel in it.
          rm -f "$BIN"/*_test "$BIN"/*_test.exe
          tar -czf "MaxLabel-${{ matrix.name }}.tar.gz" -C "$BIN" .

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: MaxLabel-${{ matrix.name }}.${{ matrix.archive }}
          fail_on_unmatched_files: true
          # The commit messages are written for a reader, so the notes come
          # from them rather than from a hand-kept list that goes stale.
          generate_release_notes: true
